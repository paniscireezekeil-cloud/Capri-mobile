pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://spotify.jfrog.io/artifactory/spotify-android-sdk-3'
            content {
                includeGroup "com.spotify.android"
            }
        }
    }
}

rootProject.name = "CapriMobile"
include(":app")
